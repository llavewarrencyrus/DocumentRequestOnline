<div class="flex items-center justify-center min-h-screen bg-slate-100">
  <p-card header="Setup Your Account" [style]="{ width: '400px' }">
    <p class="text-slate-600 mb-4 text-sm">
      Please set a secure password to activate your account.
    </p>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="pass">New Password</label>
        <p-password id="pass" [(ngModel)]="password" [toggleMask]="true" fluid="true" styleClass="w-full"
                    [feedback]="true"></p-password>
      </div>

      <div class="flex flex-col gap-2">
        <label for="confirm">Confirm Password</label>
        <p-password id="confirm" [(ngModel)]="confirmPassword" [toggleMask]="true" fluid="true" [feedback]="false"
                    styleClass="w-full"></p-password>
      </div>

      <p-button label="Activate Account"
                icon="pi pi-check"
                (onClick)="onSubmit()"
                [loading]="loading"
                [disabled]="!password || password !== confirmPassword"
                class="flex justify-end">
      </p-button>
    </div>
  </p-card>
</div>
