<div class="min-h-screen bg-gradient-to-br from-rose-50 via-white to-rose-50 flex items-center justify-center p-4">
  <p-card styleClass="w-full max-w-md shadow-2xl border-0">
    <div class="text-center mb-6">
      <div
           class="w-16 h-16 bg-gradient-to-br from-rose-500 to-rose-600 rounded-full flex items-center justify-center mx-auto mb-4">
        <i class="pi pi-key text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">Reset Your Password</h1>
      <p class="text-slate-600 mt-2">
        Enter your new password below to reset your account.
      </p>
    </div>

    <div class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="pass">New Password</label>
        <p-password id="pass" [(ngModel)]="password" [toggleMask]="true" fluid="true" styleClass="w-full"
                    [feedback]="true"></p-password>
      </div>

      <div class="flex flex-col gap-2">
        <label for="confirm">Confirm Password</label>
        <p-password id="confirm" [(ngModel)]="confirmPassword" [toggleMask]="true" fluid="true" [feedback]="false"
                    styleClass="w-full"></p-password>
      </div>

      <p-button label="Reset Password"
                icon="pi pi-check"
                (onClick)="onSubmit()"
                [loading]="loading"
                [disabled]="!password || password !== confirmPassword"
                class="flex justify-end">
      </p-button>
    </div>
  </p-card>
</div>
