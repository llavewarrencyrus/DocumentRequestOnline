<div class="space-y-2 sm:space-y-3 max-h-96 pr-2">
    @for (receipt of this.receipts(); track receipt.id; let i = $index){
    <div class="receipt-item p-3 sm:p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors active:bg-slate-100" 
         (click)="viewReceiptFile(receipt.id)">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-0">
            <div class="flex items-start sm:items-center gap-3 flex-1 min-w-0">
                <div class="flex-shrink-0 mt-0.5 sm:mt-0">
                    <i [class]="getReceiptIcon(receipt.mimeType) + ' text-xl sm:text-2xl'"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-start sm:items-center gap-2 flex-wrap sm:flex-nowrap">
                        <span class="font-medium text-sm sm:text-base text-slate-900 break-words sm:truncate">
                            {{ receipt.fileName }}
                        </span>
                        <span class="text-xs px-2 py-0.5 bg-slate-100 text-slate-600 rounded-full whitespace-nowrap">
                            {{ i + 1 }}/{{ this.receipts().length }}
                        </span>
                    </div>

                    <!-- Metadata - stacks on mobile, inline on desktop -->
                    <div class="flex flex-wrap items-center gap-2 text-xs text-slate-500 mt-1.5 sm:mt-1">
                        <span>{{ formatFileSize(receipt.fileSize) }}</span>
                        <span class="hidden sm:inline">•</span>
                        <span class="w-full sm:w-auto">Uploaded: {{ formatReceiptDate(receipt.uploadedAt) }}</span>
                    </div>
                </div>
            </div>

            <!-- Action buttons - adjusted for mobile touch targets -->
            <div class="flex items-center justify-end sm:justify-start gap-2 ml-0 sm:ml-4 mt-2 sm:mt-0 border-t sm:border-0 pt-2 sm:pt-0 border-slate-100">
                <!-- Download button - larger touch target on mobile -->
                <button pButton 
                    icon="pi pi-download" 
                    (click)="$event.stopPropagation(); downloadReceiptById(receipt.id, receipt.fileName)"
                    class="p-button-rounded p-button-text p-button-sm !text-green-600 w-10 h-10 sm:w-8 sm:h-8" 
                    pTooltip="Download"
                    tooltipPosition="top"
                    >
                </button>
                
                <!-- Delete button - larger touch target on mobile -->
                @if (this.canDelete()){
                <button pButton 
                    type="button" 
                    icon="pi pi-trash"
                    class="p-button-rounded p-button-text p-button-sm p-button-danger w-10 h-10 sm:w-8 sm:h-8" 
                    (click)="$event.stopPropagation(); confirmRemove(receipt)"
                    pTooltip="Remove" 
                    tooltipPosition="top"
                    >
                </button>
                }
            </div>
        </div>
    </div>
    }
</div>
