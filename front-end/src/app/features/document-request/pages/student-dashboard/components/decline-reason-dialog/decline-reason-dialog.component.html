<p-dialog header="Decline Reason" [visible]="isVisible()" (visibleChange)="closeDialog()" [modal]="true"
          [style]="{ width: '90vw', maxWidth: '450px' }" [draggable]="false" [resizable]="false">
  @if (selectedDeclinedRequest()){
  <div class="p-2 md:p-4">
    <div class="flex items-start mb-4">
      <div class="bg-red-100 p-2 rounded-full mr-3">
        <i class="pi pi-exclamation-triangle text-red-600 text-xl"></i>
      </div>
      <div>
        <h3 class="font-bold text-lg text-gray-900 mb-1">Request #{{ selectedDeclinedRequest()?.id }}</h3>
        <p class="text-sm text-gray-600">{{ selectedDeclinedRequest()?.documents }}</p>
      </div>
    </div>
    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
      <label class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Reason for Decline</label>
      <p class="mt-2 text-gray-800">{{ selectedDeclinedRequest()?.reason || 'No specific reason provided.' }}
      </p>
    </div>
  </div>
  }
  <ng-template pTemplate="footer">
    <button pButton label="Close" icon="pi pi-check" (click)="closeDialog()"
            class="p-button-text w-full md:w-auto"></button>
  </ng-template>
</p-dialog>
