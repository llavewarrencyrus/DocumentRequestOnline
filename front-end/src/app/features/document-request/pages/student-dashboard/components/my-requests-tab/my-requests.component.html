<div class="flex flex-col space-y-4 md:space-y-6">
  <!-- Header -->
  <div class="flex justify-between items-center">
    <h2 class="text-lg md:text-2xl font-bold text-gray-900">Your Document Requests</h2>
    <span class="text-xs md:text-sm text-gray-600 px-3 py-1 bg-gray-100 rounded-full">
      {{ filteredRequests().length }} request(s)
    </span>
  </div>

  <!-- Filters -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div class="flex flex-col gap-2">
      <p-selectButton [options]="statusFilterOptions" [unselectable]="true" [allowEmpty]="false"
                      [(ngModel)]="selectedStatusFilter" (onChange)="changeFilter($event)"
                      styleClass="w-full sm:w-auto overflow-x-auto md:text-base sm:text-sm text-xs">
      </p-selectButton>
    </div>
    <div class="text-[10px] md:text-xs text-gray-500 flex flex-wrap gap-2 md:gap-3">
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-amber-400 rounded-full mr-1"></span>Pending</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-orange-500 rounded-full mr-1"></span>Under Review</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-blue-500 rounded-full mr-1"></span>Approved</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-sky-500 rounded-full mr-1"></span>Processing</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-violet-500 rounded-full mr-1"></span>Available</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-red-500 rounded-full mr-1"></span>Declined</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-yellow-600 rounded-full mr-1"></span>Action Required</span>
      <span class="inline-flex items-center"><span
              class="inline-block w-2 h-2 bg-green-500 rounded-full mr-1"></span>Completed</span>
    </div>
  </div>

  <requests-table [filteredRequests]="filteredRequests()"
                  (callback)="onCallback($event)" />

</div>
